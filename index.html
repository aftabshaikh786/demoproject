<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wanderly — Journeys designed around you</title>
<meta name="description" content="Discover extraordinary destinations, experience local cultures and create unforgettable journeys with Wanderly.">
<meta property="og:title" content="Wanderly — Journeys designed around you">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ef;--ink:#14202b;--coral:#ff5a4e;--lag:#0fa3a3;--sand:#efe4cf;--card:#fff;--mute:#5c6770;--line:#14202b26;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1519;--ink:#f3ede2;--sand:#18232a;--card:#16222a;--mute:#9bacb6;--line:#f3ede233}}
:root[data-theme="dark"]{--bg:#0e1519;--ink:#f3ede2;--sand:#18232a;--card:#16222a;--mute:#9bacb6;--line:#f3ede233}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:calc(90px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Mukta,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--coral);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:'Yatra One',Impact,sans-serif;font-weight:800;line-height:.98;letter-spacing:-.03em;margin:0}
h2{font-size:clamp(40px,6.4vw,92px)}
section{padding:110px 0}
.e{color:var(--coral);font-style:normal}
.kick{font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12.5px;color:var(--lag);margin-bottom:16px}
.sub{max-width:540px;color:var(--mute);font-size:19px;margin:20px 0 0}
.img{width:100%;height:100%;object-fit:cover;display:block}.ph{background:linear-gradient(135deg,#d8c9a8,#b9cfc9)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 30px;border-radius:999px;border:2px solid var(--coral);background:var(--coral);color:#fff;font:700 15px Mukta,sans-serif;text-decoration:none;cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.btn:hover{box-shadow:0 12px 30px #ff5a4e66}
.btn.g{background:transparent;border-color:#fff;color:#fff}.btn.g:hover{background:#fff;color:#14202b;box-shadow:none}
.btn.d{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mag{will-change:transform;transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s,color .25s,box-shadow .25s}
/* cursor + progress */
.cur{position:fixed;left:0;top:0;z-index:99;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--coral);pointer-events:none;display:grid;place-items:center;color:#fff;font:700 11px Mukta;letter-spacing:.06em;text-transform:uppercase;transition:width .25s,height .25s,margin .25s,opacity .2s;mix-blend-mode:normal}
.cur.big{width:84px;height:84px;margin:-42px 0 0 -42px}
@media(hover:none),(prefers-reduced-motion:reduce){.cur{display:none}}
.prog{position:fixed;top:0;left:0;height:4px;background:var(--coral);width:var(--p,0%);z-index:70}
/* nav */
header{position:fixed;top:14px;left:0;right:0;z-index:60;padding-top:env(safe-area-inset-top,0px)}
.np{display:flex;justify-content:space-between;align-items:center;gap:14px;max-width:1180px;margin:0 auto;padding:10px 12px 10px 24px;border-radius:999px;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);border:1px solid #ffffff40;box-shadow:0 10px 30px #0002;position:relative}
.logo{display:flex;align-items:center;gap:8px;font:800 24px 'Yatra One',sans-serif;letter-spacing:-.04em;text-decoration:none}
.np ul{display:flex;gap:26px;list-style:none;margin:0;padding:0;font-weight:500;font-size:15px}
.np ul a{text-decoration:none;position:relative}
.np ul a::after{content:"";position:absolute;left:0;bottom:-4px;height:2px;width:100%;background:var(--coral);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.np ul a:hover::after{transform:scaleX(1)}
.mb{display:none}
@media(max-width:1000px){.mb{display:inline-flex}.np ul{display:none;position:absolute;top:70px;left:0;right:0;flex-direction:column;background:var(--bg);padding:22px 26px;border-radius:26px;box-shadow:0 20px 40px #0003;gap:16px;font-size:19px}.np ul.open{display:flex}.nb{display:none}}
/* hero */
.hero{position:relative;min-height:100svh;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:130px 0 28px;overflow:hidden;background:#0a141a}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,#0a141ad0,#0a141a40 42%,#0a141af2)}
.sl{position:absolute;inset:0;opacity:0;transition:opacity 1.4s}.sl.on{opacity:1}.sl.on .img{animation:kb 10s ease-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.14)}}
.hero .wrap{position:relative;z-index:2;width:100%}
.hr{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.hero h1{font-size:clamp(46px,8.4vw,128px);max-width:900px;text-shadow:0 4px 40px #0008}
.hero p.l{font-size:clamp(17px,1.6vw,21px);max-width:520px;margin:22px 0 28px;color:#fff;text-shadow:0 2px 20px #0009}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.pager{display:grid;gap:6px;min-width:190px}
.pager button{display:grid;grid-template-columns:34px 1fr;align-items:center;text-align:left;background:none;border:0;color:#fff9;font:700 14px Mukta;cursor:pointer;padding:6px 0;position:relative}
.pager button[aria-current="true"]{color:#fff}.pager i{font-style:normal;font-size:12px}
.pager button::after{content:"";position:absolute;left:34px;right:0;bottom:2px;height:2px;background:#fff3}
.pager button[aria-current="true"]::before{content:"";position:absolute;left:34px;bottom:2px;height:2px;background:var(--coral);z-index:1;animation:fill 6.5s linear forwards}
@keyframes fill{from{width:0}to{width:calc(100% - 34px)}}
@media(max-width:700px){.pager{display:flex;min-width:0}.pager button{grid-template-columns:1fr}.pager i,.pager span{display:none}.pager button{width:34px;height:6px;padding:0;background:#fff4;border-radius:4px}.pager button[aria-current="true"]{background:var(--coral)}.pager button::after,.pager button::before{display:none!important}}
.sbar{display:grid;grid-template-columns:1.5fr 1fr 1fr .7fr auto;gap:12px;align-items:end;background:#ffffff1f;backdrop-filter:blur(20px);border:1px solid #ffffff55;border-radius:28px;padding:16px;margin-top:30px}
@media(max-width:900px){.sbar{grid-template-columns:1fr 1fr}.sbar .f1,.sbar button{grid-column:1/-1}}
.sbar label,.fm label{display:block;font:700 11px Mukta;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}
.sbar label{color:#fffc}
.sbar input{width:100%;font:500 16px Mukta;color:#fff;background:#ffffff22;border:1px solid #ffffff55;border-radius:14px;padding:12px 14px;color-scheme:dark}
.sbar input::placeholder{color:#ffffffaa}.sbar input:focus{outline:none;border-color:#fff}
.er{color:#ff8a7d;font-weight:700;font-size:12.5px;min-height:1px;margin-top:3px}
/* words */
.wd span{display:inline-block;margin-right:.26em;opacity:0;transform:translateY(70%) rotate(5deg);transition:opacity .8s,transform .9s cubic-bezier(.2,.8,.2,1)}
.wd.in span{opacity:1;transform:none}
/* accordion */
.acc{display:flex;gap:12px;height:min(640px,78vh);margin-top:50px}
.pn{position:relative;flex:1;border-radius:30px;overflow:hidden;cursor:pointer;transition:flex .8s cubic-bezier(.2,.8,.2,1);color:#fff;background:#222}
.pn.on{flex:6}
.pn .img{position:absolute;inset:0;transition:transform 1.2s}.pn:hover .img{transform:scale(1.06)}
.pn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 35%,#0a141ae6)}
.vt{position:absolute;left:50%;bottom:28px;z-index:2;writing-mode:vertical-rl;transform:translateX(-50%) rotate(180deg);font:800 28px 'Yatra One';letter-spacing:-.01em;white-space:nowrap;transition:opacity .3s}
.pn.on .vt{opacity:0}
.pc{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:30px;opacity:0;transform:translateY(24px);transition:opacity .5s,transform .6s;pointer-events:none}
.pn.on .pc{opacity:1;transform:none;pointer-events:auto;transition-delay:.25s}
.pc h3{font-size:clamp(34px,4.4vw,62px)}.pc small{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#ffd2cc}
.pc p{margin:10px 0 18px;max-width:440px;color:#fff}
.pc .cta .btn{padding:12px 22px;font-size:14px}
@media(max-width:760px){.acc{flex-direction:column;height:auto}.pn{flex:none;height:84px;transition:height .7s cubic-bezier(.2,.8,.2,1)}.pn.on{height:430px}.vt{writing-mode:horizontal-tb;transform:none;left:24px;bottom:auto;top:24px}}
/* experiences */
.eg{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:230px;gap:16px;margin-top:50px}
.tilt{transition:transform .2s ease-out;will-change:transform}
.ex{position:relative;border-radius:26px;overflow:hidden;color:#fff;display:block;text-decoration:none;height:100%}
.ex .img{position:absolute;inset:0;transition:transform .9s}.ex:hover .img{transform:scale(1.1)}
.ex::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#0a141aee)}
.ex div{position:absolute;left:20px;right:20px;bottom:18px;z-index:2}
.ex h3{font-size:clamp(22px,2.4vw,34px)}.ex span{display:block;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s,opacity .5s;font-size:15px}
.ex:hover span,.ex:focus-visible span{max-height:60px;opacity:1}
.eg>:nth-child(1){grid-column:span 2;grid-row:span 2}.eg>:nth-child(4){grid-row:span 2}.eg>:nth-child(6){grid-column:span 2}
@media(max-width:860px){.eg{grid-template-columns:1fr 1fr;grid-auto-rows:200px}.eg>:nth-child(n){grid-column:auto;grid-row:auto}.eg>:nth-child(1){grid-column:span 2}.ex span{max-height:60px;opacity:1}}
/* packages */
.bar{display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;margin:44px 0 30px}
.ch{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:none;color:var(--ink);padding:8px 18px;border-radius:999px;font:700 13px Mukta;cursor:pointer;transition:background .2s,color .2s}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
select{font:600 14px Mukta;background:var(--card);color:var(--ink);border:2px solid var(--ink);border-radius:12px;padding:9px 12px}
.pk{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
@media(max-width:980px){.pk{grid-template-columns:1fr 1fr}}@media(max-width:620px){.pk{grid-template-columns:1fr}}
.cd{background:var(--card);border-radius:28px;overflow:hidden;box-shadow:0 14px 40px #14202b1a;height:100%;display:flex;flex-direction:column}
.cd .im{aspect-ratio:4/3;overflow:hidden;position:relative}.cd .im .img{transition:transform .9s}.cd:hover .im .img{transform:scale(1.08)}
.dur{position:absolute;top:14px;left:14px;background:#fffffff0;color:#14202b;border-radius:999px;padding:4px 14px;font-weight:700;font-size:13px}
.cd .bd{padding:22px;display:flex;flex-direction:column;gap:10px;flex:1}
.cd small{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11.5px;color:var(--lag)}
.cd h3{font-size:28px}.cd p{margin:0;color:var(--mute);font-size:15px}
.ac{display:flex;gap:6px;flex-wrap:wrap}.ac span{font-size:12.5px;background:var(--sand);padding:3px 12px;border-radius:999px}
.pr{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.pr em{display:block;font-size:11px;font-style:normal;color:var(--mute)}.pr strong{font:800 28px 'Yatra One'}
.empty{padding:44px;border:2px dashed var(--line);border-radius:24px;text-align:center}
.nt{font-size:13.5px;color:var(--mute);margin-top:26px}
/* modal */
.md{position:fixed;inset:0;z-index:90;background:#0a141acc;backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fade .3s}
@keyframes fade{from{opacity:0}}
.mb2{background:var(--bg);border-radius:32px;max-width:900px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr;animation:pop .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:translateY(30px) scale(.96);opacity:0}}
.mb2 .im{min-height:320px}.mb2 .tx{padding:30px;position:relative}
.mb2 ol{padding-left:18px;color:var(--mute);margin:14px 0 20px}
.x{position:absolute;top:14px;right:14px;width:42px;height:42px;border-radius:50%;border:0;background:var(--sand);color:var(--ink);font-size:18px;cursor:pointer}
@media(max-width:720px){.mb2{grid-template-columns:1fr}.mb2 .im{min-height:200px}}
/* trip builder */
.tb{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;margin-top:50px;align-items:start}
@media(max-width:940px){.tb{grid-template-columns:1fr}}
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.pick{grid-template-columns:1fr 1fr}}
.pi{position:relative;aspect-ratio:3/4;border-radius:22px;overflow:hidden;border:3px solid transparent;padding:0;cursor:pointer;color:#fff;background:#222;transition:transform .3s,border-color .3s}
.pi:hover{transform:translateY(-6px)}.pi[aria-pressed="true"]{border-color:var(--coral)}
.pi .img{position:absolute;inset:0;transition:transform .8s}.pi:hover .img{transform:scale(1.1)}
.pi::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 45%,#0a141ae6)}
.pi b{position:absolute;left:12px;bottom:10px;z-index:2;font:800 20px 'Yatra One';text-align:left}
.pi i{position:absolute;top:10px;right:10px;z-index:2;width:30px;height:30px;border-radius:50%;background:#fffc;color:#14202b;display:grid;place-items:center;font-style:normal;font-weight:800;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.pi[aria-pressed="true"] i{transform:scale(1);background:var(--coral);color:#fff}
.tl{margin:26px 0 0;padding:0;list-style:none;position:relative}
.tl::before{content:"";position:absolute;left:19px;top:10px;bottom:10px;border-left:2px dashed var(--coral)}
.tl li{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:8px 0;animation:slide .5s cubic-bezier(.2,.8,.2,1) both;position:relative}
@keyframes slide{from{opacity:0;transform:translateX(-24px)}}
.tl .n{width:40px;height:40px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;font-weight:800}
.tl b{font:800 22px 'Yatra One'}.tl small{display:block;color:var(--mute)}
.tl button{border:0;background:var(--sand);color:var(--ink);width:34px;height:34px;border-radius:50%;cursor:pointer;margin-left:4px}
.rs{font-weight:700;color:var(--lag);margin:14px 0 0}
.fm .fg{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fm .f{grid-column:1/-1}
@media(max-width:560px){.fm .fg{grid-template-columns:1fr}}
.fm label{color:var(--mute)}
.fm input,.fm select,.fm textarea{width:100%;font:500 16px Mukta;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.fm input:focus,.fm select:focus,.fm textarea:focus{outline:none;border-color:var(--coral)}
.fm .er{color:#d23b2e}
.fb{margin-top:16px;padding:14px 18px;border-radius:14px;background:var(--sand)}
/* why */
.wy{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
@media(max-width:860px){.wy{grid-template-columns:1fr}}
.wp{position:sticky;top:100px;aspect-ratio:4/5;border-radius:36px;overflow:hidden}
.wp .img{position:absolute;inset:0;opacity:0;transition:opacity .9s,transform 1.4s;transform:scale(1.08)}.wp .img.on{opacity:1;transform:none}
.wi{padding:22px 0;border-bottom:1px solid var(--line);cursor:pointer}
.wi h3{font-size:clamp(24px,3vw,38px);display:flex;gap:16px;align-items:baseline;transition:color .3s,transform .3s}
.wi h3 i{font:700 14px Mukta;color:var(--coral);font-style:normal}
.wi p{margin:0;max-height:0;overflow:hidden;opacity:0;color:var(--mute);transition:max-height .5s,opacity .5s,margin .5s}
.wi.on h3{color:var(--coral);transform:translateX(10px)}.wi.on p{max-height:90px;opacity:1;margin-top:10px}
/* stories */
.sg{display:grid;grid-template-columns:1.25fr 1fr;gap:28px;margin-top:50px}
@media(max-width:860px){.sg{grid-template-columns:1fr}}
.sf{display:flex;flex-direction:column;gap:14px;text-decoration:none}
.sf .im,.sl2 .im{border-radius:26px;overflow:hidden}.sf .im{height:430px}
.sf .img,.sl2 .img{transition:transform 1s}.sf:hover .img,.sl2:hover .img{transform:scale(1.07)}
.sr{display:flex;flex-direction:column;gap:22px}
.sl2{display:grid;grid-template-columns:150px 1fr;gap:18px;text-decoration:none;align-items:center}.sl2 .im{height:130px}
.cat{font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:11.5px;color:var(--coral)}
.sg h3{font-size:clamp(24px,3vw,40px)}.sl2 h3{font-size:22px}
.rd{font-weight:700;display:inline-flex;gap:8px;transition:gap .3s}.sf:hover .rd,.sl2:hover .rd{gap:16px}
/* gallery */
.gg{columns:3 260px;column-gap:16px;margin-top:50px}
.gg button{display:block;width:100%;margin:0 0 16px;padding:0;border:0;border-radius:22px;overflow:hidden;cursor:zoom-in;background:#222;position:relative;clip-path:inset(0 0 100% 0 round 22px);transition:clip-path 1s cubic-bezier(.2,.8,.2,1)}
.gg button.in{clip-path:inset(0 0 0 0 round 22px)}
.gg .img{transition:transform .9s}.gg button:hover .img{transform:scale(1.08)}
.lb{position:fixed;inset:0;z-index:95;background:#0a141af2;display:grid;place-items:center;padding:20px;animation:fade .3s}
.lb .box{width:min(980px,92vw);height:min(640px,70vh);border-radius:24px;overflow:hidden}
.lb p{color:#fff;text-align:center;margin:12px 0 0}
.lb button{position:absolute;width:50px;height:50px;border-radius:50%;border:0;background:#fff;color:#14202b;font-size:22px;cursor:pointer}
/* contact */
.ct{position:relative;padding:0;background:#0a141a;color:#fff;overflow:hidden}
.ct .bgi{position:absolute;inset:-8% 0;opacity:.55}
.ct::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#0a141af2,#0a141a99)}
.ct .wrap{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:56px;padding-top:110px;padding-bottom:110px}
@media(max-width:900px){.ct .wrap{grid-template-columns:1fr}}
.ct .kick{color:#7ff0e6}.ct h2 .e{color:#ff9a90}
.ct ul{list-style:none;padding:0;margin:24px 0;color:#ffffffcc;display:grid;gap:8px}
.gl{background:#ffffff1c;backdrop-filter:blur(20px);border:1px solid #ffffff44;border-radius:28px;padding:26px}
.gl h3{font-size:30px;margin-bottom:12px}.gl+.gl{margin-top:18px}
.ct .fm label{color:#fffd}
.ct .fm input,.ct .fm select,.ct .fm textarea{background:#ffffff22;border-color:#ffffff55;color:#fff;color-scheme:dark}
.ct .fm ::placeholder{color:#ffffffaa}.ct .fm .er{color:#ffb4ab}.ct .fb{background:#00000055}
.nlr{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}.nlr .fm{flex:1;min-width:180px}
/* footer */
footer{background:#0a141a;color:#f3ede2;padding:80px 0 26px;overflow:hidden}
.fg4{display:grid;grid-template-columns:1.5fr 1fr 1fr 1.2fr;gap:34px}
@media(max-width:860px){.fg4{grid-template-columns:1fr 1fr}}
footer h4{margin:0 0 14px;color:#ff9a90;font:700 12px Mukta;letter-spacing:.14em;text-transform:uppercase}
footer ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}footer a{text-decoration:none;color:#f3ede2cc}footer a:hover{color:#fff;text-decoration:underline}
.mega{font:800 clamp(80px,21vw,330px)/.8 'Yatra One',sans-serif;letter-spacing:-.06em;margin:56px 0 10px;background:linear-gradient(90deg,#ff5a4e,#0fa3a3);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:.9;user-select:none}
.cr{font-size:12px;line-height:1.7;color:#9bacb6;margin:0 0 14px}
.fb2{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:#9bacb6;border-top:1px solid #ffffff2e;padding-top:18px}
.rv{opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.rv,.wd span{opacity:1;transform:none}.gg button{clip-path:none}}

/* ===== Indian theme ===== */
:root{--bg:#fff4dc;--ink:#2a1208;--coral:#c2185b;--lag:#0a7580;--sand:#ffe6b8;--card:#fffaf0;--mute:#6a4b3a;--line:#2a120830;--gold:#ffb703}

async function deliver(kind,data){
  const text=Object.entries(data).map(([k,v])=>k+": "+v).join("\n");
  if(FORM_ENDPOINT){
    try{const r=await fetch(FORM_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({kind,...data})});
      return r.ok?{ok:true,msg:"Thank you! Your request was sent."}:{ok:false,msg:"Sorry, sending failed ("+r.status+"). Please try again."}}
    catch(e){return{ok:false,msg:"Network error — your request was not sent. Please try again."}}
  }
  if(CONTACT.email){location.href="mailto:"+CONTACT.email+"?subject="+encodeURIComponent(kind)+"&body="+encodeURIComponent(text);return{ok:true,msg:"Your email app should open with the request ready. Nothing is sent until you press send there."}}
  return{ok:false,manual:text,msg:"No email address or form service is connected yet, so nothing was sent. You can copy or download your request below."};
}
function Result({r}){
  const [c,setC]=useState("");
  useEffect(()=>setC(""),[r]);
  if(!r)return null;
  const id="manual-"+r.id;
  const copy=async()=>{try{await navigator.clipboard.writeText(r.manual);setC("Copied!")}catch(e){const t=document.getElementById(id);if(t){t.focus();t.select()}setC("Press Ctrl/Cmd+C to copy")}};
  const dl=()=>{const bl=new Blob([r.manual],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="wanderly-request.txt";document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href)};
  return html`<div class=${"fb"+(r.ok?"":" bad")} role="status"><p style=${{margin:0}}>${r.msg}</p>${r.manual&&html`<textarea id=${id} readOnly rows="6" value=${r.manual}/><div class="cta" style=${{marginTop:10}}><button type="button" class="btn" onClick=${copy}>Copy request</button><button type="button" class="btn g" style=${{color:"inherit",borderColor:"currentColor"}} onClick=${dl}>Download .txt</button>${c&&html`<span style=${{alignSelf:"center"}}>${c}</span>`}</div>`}</div>`;
}

  return html`<section class="pat3"><div class="wrap"><div class="kick">07 · झलकियाँ · Gallery</div><${H} t="Moments worth *chasing"/>
  <div class="gg" ref=${gr}>${GAL.map((k,i)=>html`<div class="gi" key=${k}><button style=${{aspectRatio:RATIO[i]}} onClick=${()=>setO(i)} data-cur="Zoom" aria-label=${"Open image: "+IMG[k][1]}><${Img} k=${k}/></button></div>`)}</div></div>
  ${o>=0&&html`<div class="lb" role="dialog" aria-modal="true" aria-label="Image viewer"><div><div class="box"><${Img} k=${GAL[o]}/></div><p>${IMG[GAL[o]][1]} · ${o+1}/${GAL.length}</p></div>
   <button ref=${cl} style=${{top:20,right:20}} onClick=${()=>setO(-1)} aria-label="Close">✕</button><button style=${{left:16,top:"50%"}} onClick=${()=>setO((o-1+GAL.length)%GAL.length)} aria-label="Previous">←</button><button style=${{right:16,top:"50%"}} onClick=${()=>setO((o+1)%GAL.length)} aria-label="Next">→</button></div>`}</section>`;
}
function Contact(){
  const [v,setV]=useState({name:"",email:"",int:"",msg:""}),[e,setE]=useState({}),[res,setRes]=useState(null),[busy,setBusy]=useState(false),[nl,setNl]=useState({e:""}),[ne,setNe]=useState({}),[nr,setNr]=useState(null),[nb,setNb]=useState(false);
  const sub=async ev=>{ev.preventDefault();const n={};if(v.name.trim().length<2)n.name="Please enter your name.";if(!EM.test(v.email))n.email="Enter a valid email.";if(v.msg.trim().length<10)n.msg="Write at least 10 characters.";setE(n);setRes(null);if(Object.keys(n).length)return;
   setBusy(true);const r=await deliver("Contact message",{Name:v.name,Email:v.email,Interest:v.int||"n/a",Message:v.msg});setBusy(false);setRes({...r,id:Date.now()});if(r.ok&&FORM_ENDPOINT)setV({name:"",email:"",int:"",msg:""})};
  const sn=async ev=>{ev.preventDefault();setNr(null);if(!EM.test(nl.e)){setNe({e:"Enter a valid email."});return}setNe({});setNb(true);const r=await deliver("Newsletter signup",{Email:nl.e});setNb(false);setNr({...r,id:"n"+Date.now()});if(r.ok&&FORM_ENDPOINT)setNl({e:""})};
  return html`<section id="contact" class="ct"><div class="bgi" data-px="0.06" aria-hidden="true"><${Img} k="taj"/></div><div class="mand" aria-hidden="true"><${Mandala}/></div><div class="wrap"><div><div class="kick">08 · संपर्क · Contact</div><${H} t="Let's talk *travel."/>
  <ul>${CONTACT.email&&html`<li>✉ <a href=${"mailto:"+CONTACT.email}>${CONTACT.email}</a></li>`}${CONTACT.phone&&html`<li>☎ <a href=${"tel:"+CONTACT.phone}>${CONTACT.phone}</a></li>`}${CONTACT.address&&html`<li>⌖ ${CONTACT.address}</li>`}${!CONTACT.email&&!CONTACT.phone&&html`<li>Contact details placeholder — add yours in CONTACT.</li>`}</ul>
  <div class="gl fm"><h3>Travel inspiration, monthly</h3><form class="nlr" onSubmit=${sn} noValidate><${Field} k="e" label="Email" type="email" v=${nl} e=${ne} set=${setNl}/><button class="btn mag" type="submit" disabled=${nb} style=${{marginBottom:20}}>${nb?"Subscribing…":"Subscribe"}</button></form><${Result} r=${nr}/></div></div>
  <form class="gl fm" onSubmit=${sub} noValidate><div class="fg"><${Field} k="name" label="Name" v=${v} e=${e} set=${setV}/><${Field} k="email" label="Email" type="email" v=${v} e=${e} set=${setV}/>
   <${Field} k="int" label="Travel interest or destination" v=${v} e=${e} set=${setV} full=${1}/><${Field} k="msg" label="Message" rows="5" v=${v} e=${e} set=${setV} full=${1}/>
   <div class="f"><button class="btn mag" type="submit" disabled=${busy}>${busy?"Sending…":"Send message →"}</button></div></div><${Result} r=${res}/></form></div></section>`;
}
function Footer({onTours,onLegal,onNews}){
  const L=(a,fn)=>a.map(x=>html`<li key=${x}><a href="#packages" onClick=${e=>{e.preventDefault();fn(x)}}>${x}</a></li>`);
  return html`<footer><div class="toran" aria-hidden="true"></div><div class="wrap"><div class="fg4"><div><a class="logo" href="#top"><${Logo}/>${BRAND}</a><p style=${{color:"#9bacb6",maxWidth:300}}>Journeys designed around you. Replace with your brand description.</p></div>
  <div><h4>Destinations</h4><ul>${L(DEST.map(d=>d.n),n=>onTours({q:n}))}</ul></div><div><h4>Travel types</h4><ul>${L(["Adventure","Beach","Culture","Luxury","Family","Food"],c=>onTours({cat:c}))}</ul></div>
  <div><h4>Connect</h4><ul>${CONTACT.email&&html`<li><a href=${"mailto:"+CONTACT.email}>${CONTACT.email}</a></li>`}${SOCIAL.filter(s=>s.h).map(s=>html`<li key=${s.l}><a href=${s.h} target="_blank" rel="noopener noreferrer">${s.l}</a></li>`)}<li><a href="#contact" onClick=${e=>{e.preventDefault();onNews()}}>Newsletter</a></li></ul></div></div>
  <div class="mega" aria-hidden="true">${BRAND}</div><p class="hi" style=${{color:"#ffd37a"}}>अतिथि देवो भव <span>— our guest is our god</span></p><p class="cr">Photo credits — ${CREDITS}</p>
  <div class="fb2"><span>© ${new Date().getFullYear()} ${BRAND}. All rights reserved.</span><span><a href="#" onClick=${e=>{e.preventDefault();onLegal("Privacy Policy")}}>Privacy Policy</a> · <a href="#" onClick=${e=>{e.preventDefault();onLegal("Terms of Service")}}>Terms</a></span></div></div></footer>`;
}
function App(){
  const [search,setSearch]=useState({q:"",d:"",r:"",n:"2",on:false}),[cat,setCat]=useState("All"),[trip,setTrip]=useState([]),[legal,setLegal]=useState(null);
  const sc=id=>setTimeout(()=>{const el=document.getElementById(id);el&&el.scrollIntoView({behavior:RM?"auto":"smooth"})},60);
  const tours=({q="",cat:c="All"})=>{setSearch(s=>({...s,q,d:"",r:"",on:false}));setCat(c);sc("packages")};
  const clear=()=>{setSearch(s=>({...s,q:"",d:"",r:"",on:false}));setCat("All")};
  const add=(k,toggle)=>setTrip(t=>t.includes(k)?(toggle?t.filter(x=>x!==k):t):[...t,k]);
  const move=(i,d)=>setTrip(t=>{const a=[...t],j=i+d;if(j<0||j>=a.length)return t;[a[i],a[j]]=[a[j],a[i]];return a});
  useEffect(()=>{
    const prog=document.getElementById("prog"),cur=document.getElementById("cur");let raf=0;
    const sc2=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;prog.style.setProperty("--p",(scrollY/(document.documentElement.scrollHeight-innerHeight)*100||0)+"%");if(!RM)document.querySelectorAll("[data-px]").forEach(el=>{const r=el.getBoundingClientRect();el.style.transform=`translateY(${(r.top+r.height/2-innerHeight/2)*-el.dataset.px}px)`})})};
    const mv=e=>{if(TOUCH)return;cur.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;const t=e.target.closest&&e.target.closest("[data-cur]");const lab=t&&t.dataset.cur;cur.classList.toggle("big",!!lab);cur.textContent=lab||"";
      const m=e.target.closest&&e.target.closest(".mag");document.querySelectorAll(".mag.on").forEach(x=>{if(x!==m){x.style.transform="";x.classList.remove("on")}});
      if(m&&!RM&&!m.disabled){const r=m.getBoundingClientRect();m.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.22}px,${(e.clientY-r.top-r.height/2)*.32}px)`;m.classList.add("on")}};
    addEventListener("scroll",sc2,{passive:true});addEventListener("mousemove",mv);sc2();
    return()=>{removeEventListener("scroll",sc2);removeEventListener("mousemove",mv)};
  },[]);
  return html`<${Header}/><main><${Hero} onSearch=${v=>{setSearch({...v,on:true});setCat("All");sc("packages")}}/><${Destinations} onAdd=${k=>add(k,true)} trip=${trip} onTours=${n=>tours({q:n})}/><${Experiences} onPick=${c=>tours({cat:c})}/><${Packages} search=${search} setSearch=${setSearch} cat=${cat} setCat=${setCat} clear=${clear} onAdd=${k=>add(k)}/><${Builder} trip=${trip} onAdd=${add} move=${move} setTrip=${setTrip} search=${search}/><${Why}/><${Stories}/><${Gallery}/><${Contact}/></main>
  <${Footer} onTours=${tours} onLegal=${setLegal} onNews=${()=>{sc("contact");setTimeout(()=>{const i=document.getElementById("f-e");i&&i.focus()},700)}}/>
  ${legal&&html`<${Modal} label=${legal} onClose=${()=>setLegal(null)}><h3 style=${{fontSize:32,marginBottom:14}}>${legal}</h3><p>This is placeholder text. Replace it with your real ${legal.toLowerCase()} before launching the site.</p><p class="nt">Nothing here is legal advice or a real policy.</p><button class="btn" onClick=${()=>setLegal(null)}>Close</button></${Modal}>`}`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
